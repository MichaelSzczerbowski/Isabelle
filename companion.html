<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Isabelle">
<meta name="theme-color" content="#0b0b0d">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>Isabelle</title>
<style>
:root{--ac:#ff5ca0;--bg:#0b0b0d;--card:#ffffff0f;--line:#ffffff14;--sub:#ffffff8c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding-top:env(safe-area-inset-top)}
/* jedno tło w przyciemnionym kolorze okładki (jak ekran odtwarzania w Spotify) */
:root{--tbg:#2a1420;--tcard:#ffffff14;--tbar:#1a0c13;--tsub:#ffffffa6;--glass:var(--tcard);--glassb:transparent;--sub:var(--tsub);--card:var(--tcard);--ac:#fff}
html,body{background:var(--tbg);transition:background-color .8s ease}
main{padding:12px 18px calc(112px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.page{display:none}.page.on{display:block}
h1{font-size:28px;margin:8px 2px 14px;font-weight:800;letter-spacing:-.4px}
h2{font-size:15px;color:#ffffffb0;margin:22px 4px 8px;font-weight:650}
.sub{color:var(--sub);font-size:13px}
/* pasek zakładek jak wyspa: pływająca szklana pigułka */
/* pasek zakładek jak wyspa: czarna pigułka, aktywna zakładka rozwija się z nazwą */
.tabs{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));width:max-content;margin:0 auto;display:flex;gap:4px;padding:6px;background:#000;border-radius:30px;z-index:5;box-shadow:0 10px 30px #0007,inset 0 0 0 1px #ffffff12}
.tab{display:flex;align-items:center;gap:0;height:44px;padding:0 13px;border:0;border-radius:22px;background:none;color:#ffffff73;font-size:14px;font-weight:650;white-space:nowrap;transition:background .3s,color .3s,gap .3s,padding .3s}
.tab svg{width:24px;height:24px;flex:none;transition:transform .3s}
.tab span{max-width:0;overflow:hidden;opacity:0;transition:max-width .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
.tab.on{background:#ffffff1f;color:#fff;gap:8px;padding:0 16px 0 13px}
.tab.on span{max-width:110px;opacity:1}
.tab:active svg{transform:scale(.88)}
.seg{display:flex;background:var(--glass);border:1px solid var(--glassb);border-radius:18px;padding:4px;gap:4px;margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;color:#fff;font-size:13px;font-weight:650;padding:9px 8px;border-radius:15px}
.seg button.on{background:#fff;color:#000}
/* teraz gra */
.cover{width:100%;aspect-ratio:1;border-radius:22px;background:#ffffff14 center/cover no-repeat;box-shadow:0 20px 50px #0008;margin:6px 0 20px}
.tt{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{font-size:16px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{margin:18px 0 6px;height:22px;display:flex;align-items:center;touch-action:none}
.bar{position:relative;height:5px;border-radius:3px;background:#ffffff26;flex:1}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#fff}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.ctr{display:flex;align-items:center;justify-content:center;gap:34px;margin:14px 0 18px}
.ctr button{background:none;border:0;color:#fff;padding:6px}
.ctr svg{width:34px;height:34px}
.big{width:72px;height:72px;border-radius:36px;background:#fff!important;color:#000!important;display:flex;align-items:center;justify-content:center}
.big svg{width:30px;height:30px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:#ffffff26;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 2px 6px #0006}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#fff;background:var(--glass);border:1px solid var(--glassb);border-radius:12px;padding:5px 11px}
.lyr{margin-top:22px;background:var(--glass);border:1px solid var(--glassb);border-radius:24px;padding:18px 18px 22px;max-height:46vh;overflow:auto;scroll-behavior:smooth}
.lyr p{margin:0 0 12px;font-size:20px;font-weight:750;color:#ffffff4d;transition:color .25s}
.lyr p.on{color:#fff}
/* listy */
.search{width:100%;background:var(--glass);border:1px solid var(--glassb);border-radius:16px;color:#fff;font-size:16px;padding:12px 16px;outline:none}
.search::placeholder{color:#ffffff66}
.search:focus{border-color:var(--ac)}
.row{display:flex;align-items:center;gap:12px;padding:8px 8px;border-radius:14px}
.row:active{background:#ffffff14}
.art{width:48px;height:48px;border-radius:10px;background:#ffffff14 center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:#ffffff70;font-size:18px}
.art.round{border-radius:24px}
.x{flex:1;min-width:0}
.t1{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.cur .t1{color:var(--ac);font-weight:700}
.btn{border:0;border-radius:20px;background:var(--ac);color:#000;font-weight:700;font-size:15px;padding:12px 18px}
.btn.ghost{background:var(--card);color:#fff}
.btns{display:flex;gap:8px;margin:12px 0}
.card{background:var(--glass);border:1px solid var(--glassb);border-radius:22px;padding:16px;margin:10px 0}
.list{background:var(--glass);border:1px solid var(--glassb);border-radius:22px;padding:6px;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--glass);border:1px solid var(--glassb);border-radius:20px;padding:14px}
.stat b{display:block;font-size:26px}
.stat span{font-size:12px;color:var(--sub)}
.rk{display:flex;gap:12px;align-items:center;padding:5px 0}
.rk .n{width:22px;font-weight:800;color:var(--sub)}
.rk:first-child .n{color:var(--ac)}
.sbar{height:6px;border-radius:3px;background:#ffffff1f;margin:5px 0 10px}
.sbar i{display:block;height:100%;border-radius:3px;background:var(--ac)}
.qr{background:#fff;border-radius:20px;padding:14px;width:240px;margin:12px auto;display:block}
.empty{color:var(--sub);text-align:center;padding:30px 10px;font-size:14px}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glassb);color:#fff;border-radius:16px;padding:8px 14px;font-size:14px;margin:4px 0 10px}
.btn.ghost{background:var(--glass);border:1px solid var(--glassb)}
/* mini odtwarzacz nad zakładkami (na innych zakładkach) */
#mini{position:fixed;left:14px;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));max-width:530px;margin:0 auto;display:none;align-items:center;gap:12px;padding:8px 10px 8px 8px;background:var(--tbar);border:1px solid var(--glassb);border-radius:20px;z-index:5;box-shadow:0 10px 30px #0005}
#mini .art{width:44px;height:44px}
#mini button{background:#fff;border:0;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex:none}
#mini button svg{width:18px;height:18px}
body.mini main{padding-bottom:calc(176px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#000;font-weight:700;border-radius:20px;padding:10px 18px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;white-space:nowrap}
.off{background:#ff453a26;color:#ff8a80;border-radius:14px;padding:10px 14px;font-size:13px;margin:8px 0;display:none}
</style>
</head>
<body>
<main>
  <!-- ======= TERAZ GRA ======= -->
  <section class="page on" id="p-now">
    <div class="seg" id="mode"><button data-m="pc">Gra na komputerze</button><button data-m="phone">Gra w telefonie</button></div>
    <div class="off" id="offline">Brak połączenia z komputerem – czy Isabelle jest włączona i telefon jest w tym samym Wi-Fi?</div>
    <div class="cover" id="cv"></div>
    <div class="tt" id="tt">–</div>
    <div class="ta" id="ta"></div>
    <div style="margin-top:8px"><span class="chip" id="src"></span></div>
    <div class="prog" id="prog"><div class="bar"><i id="pfill"></i></div></div>
    <div class="times"><span id="tpos">0:00</span><span id="tdur">0:00</span></div>
    <div class="ctr">
      <button id="bprev" aria-label="Poprzedni"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="bplay" class="big" aria-label="Pauza"><svg viewBox="0 0 24 24" fill="currentColor" id="iplay"><path d="M7 4l13 8-13 8z"/></svg></button>
      <button id="bnext" aria-label="Następny"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>
    </div>
    <div class="lyr" id="lyr" style="display:none"></div>
  </section>

  <!-- ======= BIBLIOTEKA ======= -->
  <section class="page" id="p-lib">
    <h1>Moja muzyka</h1>
    <input class="search" id="lq" placeholder="Filtruj bibliotekę" autocomplete="off">
    <div class="btns"><button class="btn" id="shuf">Losowo</button><span class="sub" id="lcount" style="align-self:center"></span></div>
    <div id="llist"></div>
  </section>

  <!-- ======= SZUKAJ ======= -->
  <section class="page" id="p-search">
    <h1>Szukaj</h1>
    <input class="search" id="sq" placeholder="Utwór, stacja, podcast…" autocomplete="off">
    <div id="sres"></div>
  </section>

  <!-- ======= WIĘCEJ ======= -->
  <section class="page" id="p-more">
    <h1>Więcej</h1>
    <div class="seg" id="mseg"><button data-v="wrapped" class="on">Wrapped</button><button data-v="party">Impreza</button><button data-v="info">Aplikacja</button></div>
    <div id="mview"></div>
  </section>
</main>

<nav class="tabs">
  <button class="tab on" data-p="now" aria-label="Teraz"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="1.5" y="6.5" width="21" height="11" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="7" y="10" width="2" height="4" rx="1"/><rect x="11" y="8.8" width="2" height="6.4" rx="1"/><rect x="15" y="10.6" width="2" height="2.8" rx="1"/></svg><span>Teraz</span></button>
  <button class="tab" data-p="lib" aria-label="Biblioteka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="4" width="12" height="16" rx="3.5"/><path d="M14.5 6.2a6.5 6.5 0 1 1 0 11.6" stroke-linecap="round"/><circle cx="8.5" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg><span>Biblioteka</span></button>
  <button class="tab" data-p="search" aria-label="Szukaj"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M20.5 20.5l-4.6-4.6"/><path d="M7.2 9a3.6 3.6 0 0 1 2.6-2.4" stroke-width="1.8" opacity=".7"/></svg><span>Szukaj</span></button>
  <button class="tab" data-p="more" aria-label="Więcej"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2.8"/><rect x="13" y="3" width="8" height="8" rx="4" opacity=".55"/><rect x="3" y="13" width="8" height="8" rx="4" opacity=".55"/><rect x="13" y="13" width="8" height="8" rx="2.8"/></svg><span>Więcej</span></button>
</nav>
<div id="mini"><div class="art" id="mcv"></div><div class="x"><div class="t1" id="mtt"></div><div class="t2" id="mta"></div></div><button id="mplay" aria-label="Pauza"><svg viewBox="0 0 24 24" fill="#000" id="miplay"><path d="M7 4l13 8-13 8z"/></svg></button></div>
<div id="toast"></div>
<audio id="au" preload="auto" playsinline></audio>

<script>
const K = new URLSearchParams(location.search).get('k') || localStorage.getItem('k') || '';
localStorage.setItem('k', K);
const EN = !(navigator.language || '').toLowerCase().startsWith('pl');
const T = (pl, en) => EN ? en : pl;
const $ = id => document.getElementById(id);
const esc = s => (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const U = (p, q) => p + '?k=' + encodeURIComponent(K) + (q ? '&' + q : '');
const api = (p, q) => fetch(U(p, q)).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function toast(m) { const t = $('toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.opacity = 0, 2000); }
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

// manifest z kluczem (aplikacja z ekranu głównego otwiera się od razu połączona)
const ml = document.createElement('link'); ml.rel = 'manifest'; ml.href = '/manifest.json?k=' + encodeURIComponent(K); document.head.appendChild(ml);

// ---------- teksty interfejsu po angielsku ----------
if (EN) {
  document.querySelector('#mode [data-m=pc]').textContent = 'Playing on PC';
  document.querySelector('#mode [data-m=phone]').textContent = 'Playing on phone';
  $('offline').textContent = "Can't reach your PC – is Isabelle running and the phone on the same Wi-Fi?";
  document.querySelector('#p-lib h1').textContent = 'My music'; $('lq').placeholder = 'Filter library'; $('shuf').textContent = 'Shuffle';
  document.querySelector('#p-search h1').textContent = 'Search'; $('sq').placeholder = 'Song, station, podcast…';
  document.querySelector('#p-more h1').textContent = 'More';
  document.querySelector('#mseg [data-v=party]').textContent = 'Party'; document.querySelector('#mseg [data-v=info]').textContent = 'App';
  const names = { now: 'Now', lib: 'Library', search: 'Search', more: 'More' };
  document.querySelectorAll('.tab').forEach(b => { b.lastChild.textContent = names[b.dataset.p]; b.setAttribute('aria-label', names[b.dataset.p]); });
}

// ---------- zakładki ----------
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p-' + b.dataset.p));
  if (b.dataset.p === 'lib') loadLib();
  if (b.dataset.p === 'more') renderMore();
  if (b.dataset.p === 'search' && !$('sq').value) showSubs();
  updateMini();
});
$('mini').onclick = e => { if (e.target.closest('#mplay')) return; document.querySelector('.tab[data-p=now]').click(); };
$('mplay').onclick = () => $('bplay').click();

// ---------- tryb: komputer / telefon ----------
let mode = localStorage.getItem('mode') || 'pc';
function setMode(m) {
  mode = m; localStorage.setItem('mode', m);
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('lyr').style.display = 'none'; lastLyr = '';
  if (m === 'pc') { au.pause(); } else { $('offline').style.display = 'none'; }
  renderPhone();
}
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => setMode(b.dataset.m));

// ---------- teraz gra: komputer ----------
let now = null, nowAt = 0, lastCover = '', lastLyr = '', lyrics = [], volBusy = 0;
function setAccent(c) { /* w stylu „kolor z okładki” akcent jest zawsze biały */ }
function setCover(url) {
  $('cv').style.backgroundImage = url ? 'url("' + url + '")' : '';
  $('mcv').style.backgroundImage = url ? 'url("' + url + '")' : '';
  palette(url);
}
// jeden dominujący kolor z okładki -> przyciemnione tło, karty i pasek w tym samym odcieniu
function tone(h, sat) {
  const r = document.documentElement.style, S = Math.round(Math.min(sat, 0.7) * 100);
  r.setProperty('--tbg', 'hsl(' + h + ',' + S + '%,17%)');
  r.setProperty('--tcard', 'hsl(' + h + ',' + S + '%,24%)');
  r.setProperty('--tbar', 'hsl(' + h + ',' + S + '%,11%)');
  r.setProperty('--tsub', 'hsl(' + h + ',' + Math.round(Math.min(sat, 0.5) * 100) + '%,80%)');
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = 'hsl(' + h + ',' + S + '%,17%)';
}
function palette(url) {
  const fallback = () => tone(330, 0.45);
  if (!url) return fallback();
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 24;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, 24, 24);
      const d = x.getImageData(0, 0, 24, 24).data, B = {};
      let grey = 0, all = 0;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
        const sat = mx === mn ? 0 : (mx - mn) / (1 - Math.abs(2 * l - 1));
        all++;
        if (sat < 0.15 || l < 0.08 || l > 0.95) { grey++; continue; }
        let h = mx === r ? (g - b) / (mx - mn) : mx === g ? 2 + (b - r) / (mx - mn) : 4 + (r - g) / (mx - mn); h = (h * 60 + 360) % 360;
        const k = Math.round(h / 20) % 18, w = sat * (1 - Math.abs(l - 0.5));
        const o = B[k] || (B[k] = { w: 0, h: 0, s: 0, n: 0 }); o.w += w; o.h += h * w; o.s += sat * w; o.n++;
      }
      const best = Object.values(B).sort((a, b) => b.w - a.w)[0];
      if (!best || grey / all > 0.85) return tone(240, 0.06); // czarno-biała okładka -> neutralny grafit
      tone(Math.round(best.h / best.w), best.s / best.w);
    } catch (e) { fallback(); }
  };
  img.onerror = fallback;
  img.src = url;
}
// mini odtwarzacz na zakładkach innych niż „Teraz”
function updateMini() {
  const onNow = document.querySelector('.tab[data-p=now]').classList.contains('on');
  const has = mode === 'pc' ? !!(now && now.title) : !!cur;
  const show = !onNow && has;
  $('mini').style.display = show ? 'flex' : 'none';
  document.body.classList.toggle('mini', show);
  if (!show) return;
  $('mtt').textContent = $('tt').textContent;
  $('mta').textContent = $('ta').textContent;
  const playing = mode === 'pc' ? now && now.playing : !au.paused;
  $('miplay').innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4l13 8-13 8z"/>';
}
async function poll() {
  if (mode !== 'pc') return;
  try {
    const n = await api('/api/now');
    $('offline').style.display = 'none';
    now = n; nowAt = performance.now();
    $('tt').textContent = n.title || T('Nic nie gra', 'Nothing playing');
    $('ta').textContent = n.artist || '';
    $('src').textContent = n.app || '';
    $('src').style.display = n.app ? '' : 'none';
    setAccent(n.accent);
    if (n.cover !== lastCover) { lastCover = n.cover; setCover(n.cover ? U('/api/cover', 'v=' + encodeURIComponent(n.cover)) : ''); }
    playIcon(n.playing);
    if (n.lyricsKey !== lastLyr) { lastLyr = n.lyricsKey; loadLyrics(); }
  } catch (e) { $('offline').style.display = 'block'; }
}
function pcPos() { if (!now) return 0; return now.pos + (now.playing ? (performance.now() - nowAt) / 1000 : 0); }
async function loadLyrics() {
  try {
    const l = await api('/api/lyrics');
    lyrics = l.lines || [];
    const box = $('lyr');
    if (!lyrics.length) { box.style.display = 'none'; return; }
    box.innerHTML = lyrics.map((x, i) => '<p data-i="' + i + '">' + esc(x.text || '♪') + '</p>').join('');
    box.style.display = 'block';
    box.querySelectorAll('p').forEach(p => p.onclick = () => cmd('seek', lyrics[+p.dataset.i].t));
  } catch (e) { }
}
let lyrIdx = -1;
function tick() {
  let pos, dur;
  if (mode === 'pc') { pos = Math.min(pcPos(), now ? now.dur || 1e9 : 0); dur = now ? now.dur : 0; }
  else { pos = au.currentTime || 0; dur = isFinite(au.duration) ? au.duration : 0; }
  $('tpos').textContent = fmt(pos); $('tdur').textContent = dur ? fmt(dur) : (mode === 'phone' && cur && cur.live ? 'LIVE' : '0:00');
  $('pfill').style.width = dur ? Math.min(100, pos / dur * 100) + '%' : '0%';
  if (mode === 'pc' && lyrics.length) {
    let i = -1; for (let j = 0; j < lyrics.length; j++) { if (lyrics[j].t <= pos + 0.3) i = j; else break; }
    if (i !== lyrIdx) {
      lyrIdx = i;
      const ps = $('lyr').querySelectorAll('p');
      ps.forEach((p, j) => p.classList.toggle('on', j === i));
      if (ps[i]) { const box = $('lyr'); box.scrollTop = ps[i].offsetTop - box.offsetTop - box.clientHeight / 2 + 30; }
    }
  }
  requestAnimationFrame(tick);
}
function playIcon(playing) { $('iplay').innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4l13 8-13 8z"/>'; updateMini(); }
async function cmd(c, v) {
  try { await api('/api/cmd', 'c=' + c + (v !== undefined ? '&v=' + v : '')); } catch (e) { toast(T('Brak połączenia', 'No connection')); }
  setTimeout(poll, 150);
}
$('bplay').onclick = () => {
  if (mode === 'pc') { if (now) { now.playing = !now.playing; now.pos = pcPos(); nowAt = performance.now(); playIcon(now.playing); } cmd('toggle'); }
  else { if (!au.src) return; au.paused ? au.play() : au.pause(); }
};
$('bnext').onclick = () => mode === 'pc' ? cmd('next') : phoneNext(1);
$('bprev').onclick = () => mode === 'pc' ? cmd('prev') : phoneNext(-1);
// przewijanie: dotknij / przeciągnij pasek
(() => {
  const el = $('prog'); let drag = false;
  const at = ev => { const r = el.querySelector('.bar').getBoundingClientRect(); return Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)); };
  const go = f => {
    if (mode === 'pc') { if (now && now.dur) { now.pos = f * now.dur; nowAt = performance.now(); cmd('seek', (f * now.dur).toFixed(1)); } }
    else if (isFinite(au.duration)) au.currentTime = f * au.duration;
  };
  el.addEventListener('pointerdown', e => { drag = true; el.setPointerCapture(e.pointerId); $('pfill').style.width = at(e) * 100 + '%'; });
  el.addEventListener('pointermove', e => { if (drag) $('pfill').style.width = at(e) * 100 + '%'; });
  el.addEventListener('pointerup', e => { if (drag) { drag = false; go(at(e)); } });
})();

// ---------- odtwarzacz w telefonie ----------
const au = $('au');
let queue = [], qi = -1, cur = null;
function playOnPhone(item, list, index) {
  if (list) { queue = list; qi = index; } else { queue = [item]; qi = 0; }
  startCur();
}
function startCur() {
  cur = queue[qi]; if (!cur) return;
  au.src = cur.src;
  const saved = cur.podKey ? +localStorage.getItem('pos:' + cur.podKey) || 0 : 0;
  au.onloadedmetadata = () => { if (saved > 5 && saved < au.duration - 30) au.currentTime = saved; };
  au.play().catch(() => toast(T('Dotknij ▶, aby zagrać', 'Tap ▶ to play')));
  renderPhone();
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: cur.title, artist: cur.artist || '', artwork: cur.art ? [{ src: cur.art, sizes: '512x512' }] : [] });
  }
}
function phoneNext(d) {
  if (cur && cur.podKey) { au.currentTime = Math.max(0, au.currentTime + (d > 0 ? 30 : -15)); return; }
  if (d < 0 && au.currentTime > 3) { au.currentTime = 0; return; }
  if (qi + d >= 0 && qi + d < queue.length) { qi += d; startCur(); }
}
au.onended = () => { if (cur && cur.podKey) localStorage.removeItem('pos:' + cur.podKey); phoneNext(1); };
au.onplay = au.onpause = () => { if (mode === 'phone') playIcon(!au.paused); };
setInterval(() => { if (cur && cur.podKey && !au.paused) localStorage.setItem('pos:' + cur.podKey, Math.floor(au.currentTime)); }, 5000);
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => au.play());
  navigator.mediaSession.setActionHandler('pause', () => au.pause());
  navigator.mediaSession.setActionHandler('nexttrack', () => phoneNext(1));
  navigator.mediaSession.setActionHandler('previoustrack', () => phoneNext(-1));
}
function renderPhone() {
  if (mode !== 'phone') { poll(); return; }
  $('tt').textContent = cur ? cur.title : T('Wybierz coś z biblioteki', 'Pick something from your library');
  $('ta').textContent = cur ? cur.artist || '' : T('albo wyszukaj stację lub podcast', 'or search for a station or podcast');
  $('src').textContent = T('Telefon', 'Phone'); $('src').style.display = '';
  setCover(cur && cur.art ? cur.art : '');
  playIcon(!au.paused);
}

// ---------- biblioteka ----------
let lib = null;
async function loadLib() {
  if (lib) return renderLib();
  $('llist').innerHTML = '<div class="empty">' + T('Wczytuję…', 'Loading…') + '</div>';
  try { lib = await api('/api/library'); renderLib(); }
  catch (e) { $('llist').innerHTML = '<div class="empty">' + T('Brak połączenia z komputerem', "Can't reach your PC") + '</div>'; }
}
function libItem(t) { return { title: t.title, artist: t.artist, src: U('/api/stream', 'id=' + t.id), art: t.art ? U('/api/art', 'id=' + t.id) : '', id: t.id }; }
let shown = [];
function renderLib() {
  const q = $('lq').value.trim().toLowerCase();
  shown = q ? lib.filter(t => (t.title + ' ' + t.artist + ' ' + t.album).toLowerCase().includes(q)) : lib;
  $('lcount').textContent = shown.length + ' ' + T('utw.', 'tracks');
  if (!lib.length) { $('llist').innerHTML = '<div class="empty">' + T('Biblioteka jest pusta – dodaj muzykę w Isabelle na komputerze.', 'Your library is empty – add music in Isabelle on your PC.') + '</div>'; return; }
  $('llist').className = 'list';
  $('llist').innerHTML = shown.slice(0, 200).map((t, i) => '<div class="row" data-i="' + i + '"><div class="art"' + (t.art ? ' style="background-image:url(\'' + U('/api/art', 'id=' + t.id) + '\')"' : '') + '>' + (t.art ? '' : '♪') + '</div><div class="x"><div class="t1">' + esc(t.title) + '</div><div class="t2">' + esc(t.artist) + (t.dur ? ' · ' + fmt(t.dur) : '') + '</div></div></div>').join('')
    + (shown.length > 200 ? '<div class="empty">' + T('Wpisz coś, żeby zobaczyć resztę', 'Type to see the rest') + '</div>' : '');
  $('llist').querySelectorAll('.row').forEach(r => r.onclick = () => playLib(+r.dataset.i));
}
function playLib(i, shuffle) {
  const t = shown[i];
  if (mode === 'pc') { api('/api/play', 'id=' + t.id + (shuffle ? '&shuffle=1' : '')).then(() => { toast(T('Gra na komputerze', 'Playing on PC')); setTimeout(poll, 300); }).catch(() => toast(T('Brak połączenia', 'No connection'))); }
  else {
    let list = shown.map(libItem);
    if (shuffle) list = list.sort(() => Math.random() - .5);
    playOnPhone(null, list, shuffle ? 0 : i);
  }
  document.querySelector('.tab[data-p=now]').click();
}
$('lq').oninput = () => renderLib();
$('shuf').onclick = () => { if (shown.length) playLib(Math.floor(Math.random() * shown.length), true); };

// ---------- szukaj ----------
let sTimer;
$('sq').oninput = () => { clearTimeout(sTimer); sTimer = setTimeout(search, 350); if (!$('sq').value) showSubs(); };
function rowHtml(art, t1, t2, attrs, round) {
  return '<div class="row" ' + attrs + '><div class="art' + (round ? ' round' : '') + '"' + (art ? ' style="background-image:url(\'' + esc(art) + '\')"' : '') + '>' + (art ? '' : '♪') + '</div><div class="x"><div class="t1">' + esc(t1) + '</div><div class="t2">' + esc(t2) + '</div></div></div>';
}
let sData = null;
async function search() {
  const q = $('sq').value.trim();
  if (q.length < 2) return;
  $('sres').innerHTML = '<div class="empty">' + T('Szukam…', 'Searching…') + '</div>';
  try {
    const r = sData = await api('/api/search', 'q=' + encodeURIComponent(q));
    let h = '';
    if (r.lib && r.lib.length) h += '<h2>' + T('Moja muzyka', 'My music') + '</h2>' + r.lib.map((t, i) => rowHtml(t.art ? U('/api/art', 'id=' + t.id) : '', t.title, t.artist, 'data-k="lib" data-i="' + i + '"')).join('');
    if (r.spot && r.spot.length && mode === 'pc') h += '<h2>Spotify</h2>' + r.spot.map((t, i) => rowHtml(t.art, t.title, t.sub, 'data-k="spot" data-i="' + i + '"')).join('');
    if (r.radio && r.radio.length) h += '<h2>Radio</h2>' + r.radio.map((t, i) => rowHtml('', t.title, t.sub, 'data-k="radio" data-i="' + i + '"', true)).join('');
    if (r.pods && r.pods.length) h += '<h2>' + T('Podcasty', 'Podcasts') + '</h2>' + r.pods.map((t, i) => rowHtml(t.art, t.title, t.sub, 'data-k="pod" data-i="' + i + '"')).join('');
    $('sres').innerHTML = h || '<div class="empty">' + T('Nic nie znaleziono', 'Nothing found') + '</div>';
    $('sres').querySelectorAll('.row').forEach(el => el.onclick = () => pick(el.dataset.k, +el.dataset.i));
  } catch (e) { $('sres').innerHTML = '<div class="empty">' + T('Brak połączenia z komputerem', "Can't reach your PC") + '</div>'; }
}
function pick(kind, i) {
  const r = sData;
  if (kind === 'lib') {
    const t = r.lib[i];
    if (mode === 'pc') api('/api/play', 'id=' + t.id).then(() => toast(T('Gra na komputerze', 'Playing on PC')));
    else playOnPhone(libItem(t));
  } else if (kind === 'spot') { api('/api/play', 't=' + r.spot[i].t).then(() => toast(T('Gra w Spotify', 'Playing in Spotify'))); }
  else if (kind === 'radio') {
    const s = r.radio[i];
    if (mode === 'pc') api('/api/play', 't=' + s.t).then(() => toast(T('Radio gra na komputerze', 'Radio playing on PC')));
    else playOnPhone({ title: s.title, artist: s.sub, src: s.url, art: '', live: true });
  } else if (kind === 'pod') { openShow(r.pods[i].t); return; }
  if (kind !== 'pod') { setTimeout(poll, 400); document.querySelector('.tab[data-p=now]').click(); }
}
async function showSubs() {
  try {
    const subs = await api('/api/podcasts');
    if ($('sq').value) return;
    $('sres').innerHTML = subs.length ? '<h2>' + T('Twoje podcasty', 'Your podcasts') + '</h2>' + subs.map((s, i) => rowHtml(s.art, s.title, s.author, 'data-t="' + s.t + '"')).join('') : '';
    $('sres').querySelectorAll('.row').forEach(el => el.onclick = () => openShow(el.dataset.t));
  } catch (e) { }
}
async function openShow(t) {
  $('sres').innerHTML = '<div class="empty">' + T('Wczytuję odcinki…', 'Loading episodes…') + '</div>';
  try {
    const d = await api('/api/episodes', 't=' + t);
    let h = '<button class="back" id="sback">‹ ' + T('Wróć', 'Back') + '</button>' + rowHtml(d.show.art, d.show.title, d.show.author, '');
    h += '<h2>' + T('Odcinki', 'Episodes') + '</h2>' + d.eps.map((e, i) => {
      const left = e.done ? '✓ ' : (e.pos > 0 && e.dur ? T('zostało ', '') + fmt(e.dur - e.pos) + T('', ' left') + ' · ' : '');
      return rowHtml(d.show.art, e.title, left + (e.date || '') + (e.dur ? ' · ' + Math.round(e.dur / 60) + ' min' : ''), 'data-i="' + i + '"');
    }).join('');
    $('sres').innerHTML = h;
    $('sback').onclick = () => $('sq').value ? search() : showSubs();
    $('sres').querySelectorAll('.row[data-i]').forEach(el => el.onclick = () => {
      const e = d.eps[+el.dataset.i];
      if (mode === 'pc') api('/api/play', 't=' + e.t).then(() => { toast(T('Podcast gra na komputerze', 'Podcast playing on PC')); setTimeout(poll, 400); });
      else playOnPhone({ title: e.title, artist: d.show.title, src: e.url, art: d.show.art, podKey: e.t + e.url.length });
      document.querySelector('.tab[data-p=now]').click();
    });
  } catch (e) { $('sres').innerHTML = '<div class="empty">' + T('Nie udało się wczytać odcinków', "Couldn't load episodes") + '</div>'; }
}

// ---------- więcej: Wrapped / impreza / aplikacja ----------
let moreView = 'wrapped', period = 'week';
document.querySelectorAll('#mseg button').forEach(b => b.onclick = () => { moreView = b.dataset.v; document.querySelectorAll('#mseg button').forEach(x => x.classList.toggle('on', x === b)); renderMore(); });
async function renderMore() {
  const v = $('mview');
  if (moreView === 'wrapped') {
    const ps = [['week', T('7 dni', '7 days')], ['month', T('30 dni', '30 days')], ['year', T('Rok', 'Year')], ['all', T('Od początku', 'All time')]];
    v.innerHTML = '<div class="seg">' + ps.map(p => '<button data-p="' + p[0] + '" class="' + (p[0] === period ? 'on' : '') + '">' + p[1] + '</button>').join('') + '</div><div id="wbody"><div class="empty">…</div></div>';
    v.querySelectorAll('.seg button').forEach(b => b.onclick = () => { period = b.dataset.p; renderMore(); });
    try {
      const w = await api('/api/wrapped', 'p=' + period);
      if (!w.plays) { $('wbody').innerHTML = '<div class="empty">' + T('Tu pojawią się Twoje statystyki – utwór liczy się po 30 s grania.', 'Your stats will appear here – a song counts after 30 s.') + '</div>'; return; }
      let h = '<div class="stats"><div class="stat"><b>' + w.hours + '</b><span>' + T('godzin', 'hours') + '</span></div><div class="stat"><b>' + w.plays + '</b><span>' + T('odsłuchań', 'plays') + '</span></div><div class="stat"><b>' + w.artists + '</b><span>' + T('wykonawców', 'artists') + '</span></div></div>';
      if (w.topArtists.length) h += '<div class="card"><h2 style="margin-top:0">' + T('Najczęściej słuchani', 'Top artists') + '</h2>' + w.topArtists.map((a, i) => '<div class="rk"><span class="n">' + (i + 1) + '</span><div class="x"><div class="t1">' + esc(a.name) + '</div></div><span class="sub">' + a.count + '×</span></div>').join('') + '</div>';
      if (w.topTracks.length) h += '<div class="card"><h2 style="margin-top:0">' + T('Ulubione utwory', 'Top tracks') + '</h2>' + w.topTracks.map((t, i) => '<div class="rk"><span class="n">' + (i + 1) + '</span><div class="x"><div class="t1">' + esc(t.title) + '</div><div class="t2">' + esc(t.artist) + '</div></div><span class="sub">' + t.count + '×</span></div>').join('') + '</div>';
      if (w.sources.length) h += '<div class="card"><h2 style="margin-top:0">' + T('Skąd słuchasz', 'Where you listen') + '</h2>' + w.sources.map(s => '<div style="display:flex;justify-content:space-between"><b style="font-size:14px">' + esc(s.name) + '</b><span class="sub">' + s.share + '%</span></div><div class="sbar"><i style="width:' + Math.max(3, s.share) + '%"></i></div>').join('') + '</div>';
      $('wbody').innerHTML = h;
    } catch (e) { $('wbody').innerHTML = '<div class="empty">' + T('Brak połączenia z komputerem', "Can't reach your PC") + '</div>'; }
  } else if (moreView === 'party') {
    v.innerHTML = '<div class="empty">…</div>';
    try {
      const p = await api('/api/party');
      let h = '<div class="card"><div class="t1" style="font-size:18px">' + T('Tryb imprezy 🎉', 'Party mode 🎉') + '</div><div class="sub" style="margin-top:4px">' + T('Pokaż kod znajomym – dodają piosenki do kolejki ze swoich telefonów.', 'Show the code to friends – they add songs to the queue from their phones.') + '</div>';
      if (p.running) {
        h += '<img class="qr" src="' + U('/api/partyqr', 'v=' + Date.now()) + '"><div class="btns"><button class="btn ghost" id="pstop">' + T('Zakończ imprezę', 'End the party') + '</button></div>';
        h += '<h2>' + T('Dodane przez gości', 'Added by guests') + '</h2>' + (p.guests.length ? p.guests.map(g => rowHtml('', g.title, g.artist + ' · ' + g.by, '')).join('') : '<div class="sub">' + T('Jeszcze nic', 'Nothing yet') + '</div>');
      } else h += '<div class="btns"><button class="btn" id="pstart">' + T('Zacznij imprezę', 'Start the party') + '</button></div>';
      v.innerHTML = h + '</div>';
      if ($('pstart')) $('pstart').onclick = () => api('/api/party', 'a=start').then(renderMore);
      if ($('pstop')) $('pstop').onclick = () => api('/api/party', 'a=stop').then(renderMore);
    } catch (e) { v.innerHTML = '<div class="empty">' + T('Brak połączenia z komputerem', "Can't reach your PC") + '</div>'; }
  } else {
    const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    v.innerHTML = '<div class="card"><div class="t1" style="font-size:18px">Isabelle</div><div class="sub" style="margin-top:6px">'
      + (standalone ? T('Aplikacja jest na ekranie głównym 👌', 'The app is on your home screen 👌')
        : isIOS ? T('Dodaj do ekranu: w Safari dotknij „Udostępnij” (kwadrat ze strzałką) → „Do ekranu początkowego”.', 'Add to home screen: in Safari tap Share → “Add to Home Screen”.')
          : T('Dodaj do ekranu: w Chrome dotknij ⋮ → „Dodaj do ekranu głównego”.', 'Add to home screen: in Chrome tap ⋮ → “Add to Home screen”.'))
      + '</div><div class="sub" style="margin-top:10px">' + T('Działa w tym samym Wi-Fi co komputer z włączoną Isabelle. „Gra w telefonie” odtwarza muzykę z komputera na Twoich słuchawkach.', 'Works on the same Wi-Fi as your PC running Isabelle. “Playing on phone” streams music from your PC to your headphones.') + '</div></div>';
  }
}

setMode(mode);
setInterval(poll, 1000);
requestAnimationFrame(tick);
</script>
